<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SYNDICATE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { background:#0f0f0f; color:#fff; font-family:Arial; padding:16px }
.btn { background:#1e1e1e; padding:12px; border-radius:10px; margin:6px 0; cursor:pointer }
.btn.active { background:#2c2c2c }
.check { margin:8px 0; cursor:pointer }
.check.done { opacity:.6; text-decoration:line-through }
textarea { width:100%; height:80px; margin-top:10px }
input[type=file] { margin-top:10px }
</style>
</head>
<body>

<h1>SYNDICATE</h1>
<div id="days"></div>
<div id="output"></div>

<script>
const tg = Telegram.WebApp;
tg.ready();

let TOKEN = null;
let STATE = null;
let CURRENT_DAY = 1;
let PHOTO = null;

/* ===== API ===== */
function api(url, options = {}) {
  return fetch(url, {
    ...options,
    headers: {
      ...(options.headers || {}),
      Authorization: "Bearer " + TOKEN
    }
  }).then(r => r.json());
}

/* ===== AUTH ===== */
fetch("/auth", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ initData: tg.initData })
})
.then(r => r.json())
.then(d => {
  TOKEN = d.token;
  renderDays();
  loadDay(1);
});

/* ===== DAYS ===== */
function renderDays() {
  let html = "";
  for (let i = 1; i <= 7; i++) {
    html += `<div class="btn ${i===CURRENT_DAY?"active":""}" onclick="loadDay(${i})">День ${i}</div>`;
  }
  days.innerHTML = html;
}

/* ===== LOAD ===== */
function loadDay(day) {
  CURRENT_DAY = day;
  renderDays();
  api(`/task/${day}`).then(d => {
    STATE = d;
    render();
  });
}

/* ===== RENDER ===== */
function render() {
  if (!STATE?.ok) {
    output.innerHTML = "Нет данных";
    return;
  }

  let html = `
    <h2>${STATE.task.title}</h2>
    <p>${STATE.task.description}</p>
    <h3>Чек‑лист</h3>
  `;

  STATE.checklist.forEach(i => {
    html += `
      <div class="check ${i.done ? "done" : ""}" onclick="toggle('${i.id}')">
        ${i.done ? "✅" : "⬜"} ${i.title}
      </div>
    `;
  });

  html += `
    <h3>Отчёт</h3>
    <textarea id="reportText" placeholder="Текст отчёта"></textarea>
    <input type="file" id="photoInput" accept="image/*">
    <div class="btn" onclick="uploadPhoto()">Загрузить фото</div>
    <div class="btn" onclick="submitReport()">Отправить отчёт</div>
  `;

  output.innerHTML = html;
}

/* ===== CHECKLIST ===== */
function toggle(id) {
  const item = STATE.checklist.find(i => i.id === id);
  item.done = !item.done;
  render();

  api("/checklist/toggle", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ checklist_id: id, done: item.done })
  });
}

/* ===== PHOTO ===== */
function uploadPhoto() {
  const file = document.getElementById("photoInput").files[0];
  if (!file) return alert("Выбери фото");

  const form = new FormData();
  form.append("photo", file);

  fetch("/daily-report/upload-photo", {
    method: "POST",
    headers: { Authorization: "Bearer " + TOKEN },
    body: form
  })
  .then(r => r.json())
  .then(d => {
    PHOTO = d.photo;
    alert("Фото загружено");
  });
}

/* ===== SUBMIT ===== */
function submitReport() {
  api("/daily-report/submit", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      task_id: STATE.task.id,
      report_text: document.getElementById("reportText").value,
      photo: PHOTO
    })
  }).then(() => alert("Отчёт отправлен"));
}
</script>

</body>
</html>
