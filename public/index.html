<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>SYNDICATE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { background:#0f0f0f; color:#fff; font-family:Arial; padding:16px }
.btn { background:#1e1e1e; padding:12px; border-radius:10px; margin:6px 0; cursor:pointer }
.btn.active { background:#2c2c2c }
.check { margin:8px 0; cursor:pointer }
.check.done { opacity:.6; text-decoration:line-through }
textarea { width:100%; height:80px; margin-top:10px }
</style>
</head>
<body>

<h1>SYNDICATE</h1>
<div id="days"></div>
<div id="output"></div>

<script>
const tg = Telegram.WebApp;
tg.ready();

let TOKEN = null;
let STATE = null;
let CURRENT_DAY = 1;

function api(url, options={}) {
  return fetch(url, {
    ...options,
    headers: {
      "Content-Type":"application/json",
      Authorization:"Bearer " + TOKEN
    }
  }).then(r => r.json());
}

/* AUTH */
fetch("/auth", {
  method:"POST",
  headers:{ "Content-Type":"application/json" },
  body: JSON.stringify({ initData: tg.initData })
})
.then(r => r.json())
.then(d => {
  TOKEN = d.token;
  renderDays();
  loadDay(1);
});

function renderDays() {
  let html = "";
  for (let i=1;i<=7;i++) {
    html += `<div class="btn ${i===CURRENT_DAY?"active":""}" onclick="loadDay(${i})">День ${i}</div>`;
  }
  days.innerHTML = html;
}

function loadDay(day) {
  CURRENT_DAY = day;
  renderDays();
  api(`/task/${day}`).then(d => {
    STATE = d;
    render();
  });
}

function render() {
  if (!STATE?.ok) return output.innerHTML = "Нет данных";

  let html = `<h2>${STATE.task.title}</h2>`;
  html += "<h3>Чек‑лист</h3>";

  STATE.checklist.forEach(i => {
    html += `
      <div class="check ${i.done?"done":""}" onclick="toggle('${i.id}')">
        ${i.done?"✅":"⬜"} ${i.title}
      </div>`;
  });

  if (STATE.can_open_report && !STATE.already_submitted) {
    html += `
      <h3>Отчёт</h3>
      <textarea id="reportText" placeholder="Текст отчёта"></textarea>
      <div class="btn" onclick="submitReport()">Отправить отчёт</div>
    `;
  }

  if (STATE.already_submitted) {
    html += `<p>✅ Отчёт отправлен</p>`;
  }

  output.innerHTML = html;
}

function toggle(id) {
  const item = STATE.checklist.find(i => i.id === id);
  item.done = !item.done;
  render();
  api("/checklist/toggle", {
    method:"POST",
    body: JSON.stringify({ checklist_id:id, done:item.done })
  }).then(loadDay.bind(null, CURRENT_DAY));
}

function submitReport() {
  const text = document.getElementById("reportText").value;
  api("/daily-report/submit", {
    method:"POST",
    body: JSON.stringify({
      task_id: STATE.task.id,
      report_text: text,
      photo_url: null
    })
  }).then(loadDay.bind(null, CURRENT_DAY));
}
</script>
</body>
</html>
